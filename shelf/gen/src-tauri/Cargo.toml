[package]
name = "shelf_gen"
version = "0.1.0"
description = "Shelfランチャーの生成ツール（開発者向け）"
authors = ["famibee"]
edition = "2024"
license = "MIT"

[lib]
name = "shelf_gen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# rand_core機能: SigningKey::generate（鍵生成）に必要。shelf_coreは検証のみなので持たない
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
# 署名鍵の生成（SigningKey::generate）に使う乱数源。本体（shelf_core）は検証のみなので
# 持たないが、生成ツールは新規鍵を作る必要があるためここでのみ追加する
rand = "0.8"
# ホスティング（Cloudflare R2）アップロード。SigV4署名の実装自体はこのSDKに任せる
# （自前実装は署名バグのリスクが高いため避ける）。aws-config（環境変数等からの
# 自動解決レイヤー）は使わず、Config::builder で直接エンドポイント・認証情報を
# 組み立てる（単一の固定認証情報しか扱わないため、自動探索機構は不要。旧
# patch_gen_gui の実装方針を踏襲）
aws-sdk-s3 = "1"
shelf_core = { path = "../../core" }
# crypto:trueプロジェクトのsettingSnFileName自動計算（uuidv5）に使う。旧ツール（TS側）の
# `v5(relPath, pass)`と同じRFC4122 UUIDv5アルゴリズムで、実データで一致を確認済み
# （2026-11-17、project_scan.rs参照）
uuid = { version = "1", features = ["v5"] }
