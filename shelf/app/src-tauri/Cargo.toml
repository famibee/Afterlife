[package]
name = "shelf"
version = "0.1.0"
description = "SKYNovel/BlueSNovel製ゲームのランチャー"
authors = ["famibee"]
edition = "2024"
license = "MIT"

[lib]
name = "shelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
shelf_core = { path = "../../core" }

# [profile.*] はworkspaceルート（shelf/Cargo.toml）側にのみ書く。ここに重複させると
# cargoが警告する
