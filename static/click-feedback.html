<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      .dot {
        position: fixed;
        inset: 0;
        margin: auto;
        width: 60%;
        height: 60%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 90, 60, 0.95), rgba(255, 90, 60, 0));
        animation: flash 0.6s ease-out forwards;
      }
      @keyframes flash {
        0% {
          transform: scale(0.3);
          opacity: 1;
        }
        100% {
          transform: scale(1.6);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="dot"></div>
  </body>
</html>
